# Roadmap 0.2: build + test on every PR and on main.
# Runs on Linux: Core and its tests have no Autodesk references. The Civil 3D plugin shell
# builds here via EnableWindowsTargeting. Since 0.3 its Autodesk code (src/Civil3DPlugin/Civil3D)
# compiles only where Civil 3D 2027 is installed, so here only the Autodesk-free shell builds.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CivilAI.sln

      - name: Build
        run: dotnet build CivilAI.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test CivilAI.sln --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore
